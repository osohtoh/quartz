[project]
name = "quartz"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bernard Kamiński"}
]
requires-python = "==3.13"
dependencies = []


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.pypi-dependencies]
quartz = { path = ".", editable = true}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
preview = ["pixi-build"]

[tool.pixi.dependencies]
cclib = ">=1.8.1"
griddataformats = ">=1.0.2"
numpy = ">=2.3.1"
pint = ">=0.24.4"
qcelemental = ">=0.29.0"
rdkit = ">=2025.3.3"
scikit-learn = ">=1.8.0,<2"
pytz = ">=2025.2,<2026"
psi4 = ">=1.10,<2"

[tool.pixi.feature.testing.dependencies]
pytest = ">=8.4.1"

[tool.pixi.feature.testing.tasks]
test = "pytest"

[tool.pixi.feature.jupyter.dependencies]
ipykernel = ">=7.0.1"
pandas = ">=2.3.3"
matplotlib = ">=3.10.8"
openpyxl = ">=3.1.5"
plotly = ">=6.5.2,<7"
nbformat = ">=5.10.4,<6"

[tool.pixi.feature.jupyter.tasks]
lab = "jupyter lab"

[tool.pixi.environments]
default = ["testing", "jupyter"]
testing = ["testing"]
jupyter = ["jupyter"]
